name: Bug report
title: "[BUG] "
description: Сообщите о возникшей проблеме

body:
  - type: markdown
    attributes:
      value: |
        ## Прежде чем создать проблему, пожалуйста, убедитесь, что:
        1. Вы указали четкий и краткий заголовок проблемы, чтобы другие могли быстро её найти.
        2. Вы проверили, что похожей проблемы нет среди [существующих](https://github.com/grandvan709/UniGrandBackup/issues?q=is%3Aissue), в противном случае, обсуждайте её там.
        3. Вы подробно описали проблему, следуя требованиям шаблона, иначе проблема будет закрыта без рассмотрения.

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Подробно и ясно опишите возникшую у вас проблему, при возможности приложите скриншоты.
    validations:
      required: true

  - type: input
    attributes:
      label: Версия образа
      description: Тег Docker-образа (например 1.0.0 или latest)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Как воспроизвести
      description: Шаги для воспроизведения ошибки
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Какой компонент затронут
      multiple: true
      options:
        - Конфигурация / парсинг config.yaml
        - Бэкап файлов (tar.gz)
        - Бэкап Postgres (pg_dump)
        - Бэкап SQLite (.dump)
        - Локальная ротация (retention)
        - Отправка в Telegram
        - Расписание (APScheduler)
        - Docker / Compose
        - Другое
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Операционная система хоста
      options:
        - Debian 12
        - Debian 13
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Other Linux
    validations:
      required: true

  - type: input
    attributes:
      label: Версия Docker
      description: "Результат команды: docker -v"
      placeholder: "Docker version 29.5.1"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Логи
      description: "Вставьте логи из команды: docker compose logs -ft unigrandbackup"
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: Содержимое config.yaml (без секретов)
      description: Вставьте config.yaml, заменив реальные пароли/токены на ***
      render: yaml
    validations:
      required: false

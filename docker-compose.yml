services:
  # ─── Daemon: ежедневные плановые бэкапы ─────────────────────────────────────
  unigrandbackup:
    container_name: unigrandbackup
    hostname: unigrandbackup
    image: grandvan/unigrandbackup:latest
    restart: always
    volumes:
      # Конфиг и .env с секретами
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro

      # Локальное хранилище бэкапов (ротация N последних)
      - /var/backups/unigrandbackup:/var/backups

      # Логи (опционально, можно убрать если хватает docker logs)
      - ./logs:/app/logs

      # Папки/файлы для бэкапа — read-only монтируются под теми же путями,
      # какие указаны в config.yaml services[].paths
      - /opt:/opt:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      # Подключаем сети, в которых лежат бэкапаемые БД (если они в docker).
      # Имена/наличие — под конкретный сервер. Подставь свои или убери секцию,
      # если все БД доступны по host-IP/публичному адресу.
      - myapp_network

  # ─── Restore: одноразовый запуск с RW /opt + docker.sock ────────────────────
  # Используется по требованию (НЕ автозапуск). Пример:
  #   docker compose --profile restore run --rm unigrandbackup-restore \
  #       /var/backups/unigrandbackup/myapp/myapp-20260520-030000.tar.gz --force
  unigrandbackup-restore:
    profiles: ["restore"]
    image: grandvan/unigrandbackup:latest
    entrypoint: ["python", "-m", "app.main", "restore"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - /var/backups/unigrandbackup:/var/backups
      # /opt смонтирован как RW — restore должен иметь возможность писать туда
      - /opt:/opt:rw
      # docker.sock — чтобы restore мог поднять docker compose других сервисов
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - myapp_network

networks:
  myapp_network:
    external: true

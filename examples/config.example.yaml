# UniGrandBackup — example config
#
# Любая переменная вида *_env ссылается на ИМЯ переменной из .env,
# из которой будет прочитано реальное значение секрета.

global:
  local_storage_path: /var/backups          # внутри контейнера, монтируется томом
  local_retention: 7                         # сколько последних архивов хранить локально per service
  timezone: Europe/Moscow                    # для cron-расписаний и timestamp-ов в именах файлов
  log_level: INFO                            # DEBUG | INFO | WARNING | ERROR
  language: ru                               # ru | en — язык логов и Telegram-сообщений

services:

  # ---------- myapp: файлы + postgres ----------
  - name: myapp
    enabled: true
    schedule: "0 3 * * *"                    # каждый день в 03:00 (по global.timezone)
    paths:
      - /opt/myapp/.env
      - /opt/myapp/data
    databases:
      - kind: postgres
        host: myapp-db                       # имя docker-контейнера (резолвится в myapp_network)
        port: 5432
        user: myapp_user
        password_env: MYAPP_DB_PASSWORD      # значение в .env: MYAPP_DB_PASSWORD=...
        database: myapp
        format: custom                       # pg_dump -Fc (binary, сжатый)
    local_retention: 7                       # переопределяет global.local_retention
    telegram:
      bot_token_env: BACKUP_BOT_TOKEN
      chat_id: -1001234567890                # ID супергруппы
      thread_id: 42                          # ID топика для бэкапов myapp
      send_last_only: true
      send_summary: true

  # ---------- filestore: только файлы (без БД) ----------
  - name: filestore
    enabled: true
    schedule: "30 3 * * *"                   # 03:30
    paths:
      - /opt/filestore/.env
      - /opt/filestore/uploads
    # databases: []   — нет БД, секцию опускаем целиком
    local_retention: 14                      # храним дольше, изменения редкие
    telegram:
      bot_token_env: BACKUP_BOT_TOKEN
      chat_id: -1001234567890
      thread_id: 43


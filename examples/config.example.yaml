# UniGrandBackup — example config
#
# Любая переменная вида *_env ссылается на ИМЯ переменной из .env,
# из которой будет прочитано реальное значение секрета.

global:
  local_storage_path: /var/backups          # внутри контейнера, монтируется томом
  local_retention: 7                         # сколько последних архивов хранить локально per service
  timezone: Europe/Moscow                    # для cron-расписаний и timestamp-ов в именах файлов
  log_level: INFO                            # DEBUG | INFO | WARNING | ERROR
  language: ru                               # ru | en — язык логов и Telegram-сообщений

services:

  # ---------- myapp: файлы + postgres (auto-version) ----------
  - name: myapp
    enabled: true
    schedule: "0 3 * * *"                    # каждый день в 03:00 (по global.timezone)
    paths:
      - /opt/myapp                           # целиком директория сервиса
    paths_exclude:                           # glob с поддержкой **
      - "**/.git"
      - "**/node_modules"
      - "**/__pycache__"
      - "**/backups"                         # защита от рекурсии (наш дамп лежит здесь же)
      - "**/*.log"
    databases:
      - kind: postgres
        host: myapp-db                       # имя docker-контейнера или хост
        port: 5432
        user: myapp_user
        password_env: MYAPP_DB_PASSWORD      # значение в .env: MYAPP_DB_PASSWORD=...
        database: myapp
        format: custom                       # pg_dump -Fc (binary, сжатый, рек.)
        client_version: auto                 # auto | 15 | 16 | 17 | 18
                                             # auto детектит версию сервера и берёт matching клиент
    local_retention: 7
    telegram:
      bot_token_env: BACKUP_BOT_TOKEN
      chat_id: -1001234567890
      thread_id: 42
      send_last_only: true
      send_summary: true

  # ---------- webapp: файлы + mysql ----------
  - name: webapp
    enabled: false                           # выключен — пример, включи если нужно
    schedule: "0 4 * * *"
    paths:
      - /opt/webapp
    paths_exclude:
      - "**/.git"
      - "**/node_modules"
      - "**/storage/cache"
    databases:
      - kind: mysql                          # 'mysql' или 'mariadb' — клиент один (mariadb-client)
        host: webapp-db
        port: 3306
        user: webapp
        password_env: WEBAPP_DB_PASSWORD
        database: webapp
    telegram:
      bot_token_env: BACKUP_BOT_TOKEN
      chat_id: -1001234567890
      thread_id: 43

  # ---------- filestore: только файлы (без БД) ----------
  - name: filestore
    enabled: true
    schedule: "30 3 * * *"
    paths:
      - /opt/filestore/.env
      - /opt/filestore/uploads
    local_retention: 14
    telegram:
      bot_token_env: BACKUP_BOT_TOKEN
      chat_id: -1001234567890
      thread_id: 44

